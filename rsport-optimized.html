<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="no-referrer">
<meta http-equiv="refresh" content="7200">
<title>R Sport - Watch Live Sports Online</title>
<meta name="description" content="Watch live sports, football, cricket, and TV channels online on R Sport. Enjoy HD streaming anytime, anywhere.">
<meta name="keywords" content="R Sport, live sports, football live, cricket live, live tv, sports streaming, PTV Sports, T Sports">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="R Sport - Watch Live Sports Online">
<meta property="og:description" content="Enjoy live sports and TV channels in HD quality on R Sport.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ── RESET & ROOT ─────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --neon-cyan:#00f5ff;
  --neon-magenta:#ff00e5;
  --neon-green:#00ff88;
  --neon-orange:#ff6a00;
  --bg-void:#04060a;
  --bg-deep:#070c14;
  --bg-card:#0c1220;
  --bg-card2:#111a2e;
  --border-dim:#1a2540;
  --border-glow:rgba(0,245,255,.18);
  --text-bright:#f0f8ff;
  --text-mid:#7a9bc4;
  --text-dim:#3a5070;
  --header-h:64px;
  --glow-cyan:0 0 20px rgba(0,245,255,.4),0 0 60px rgba(0,245,255,.15);
  --glow-magenta:0 0 20px rgba(255,0,229,.4),0 0 60px rgba(255,0,229,.15);
  --glow-green:0 0 20px rgba(0,255,136,.35);
}

html{scroll-behavior:smooth}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg-void);
  color:var(--text-bright);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── SCANLINE OVERLAY ─────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px
  );
  pointer-events:none;z-index:9999;
}

/* ── SCROLLBAR ────────────────────────────────── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-deep)}
::-webkit-scrollbar-thumb{background:var(--neon-cyan);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--neon-magenta)}

/* ── HEADER ───────────────────────────────────── */
header{
  position:sticky;top:0;z-index:500;
  height:var(--header-h);
  background:rgba(4,6,10,.92);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-glow);
  display:flex;align-items:center;
  padding:0 clamp(12px,4vw,32px);
  gap:14px;
}

/* ── SVG LOGO ─────────────────────────────────── */
.logo-wrap{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;flex-shrink:0;
}

.logo-svg-wrap{
  width:44px;height:44px;flex-shrink:0;
  filter:drop-shadow(0 0 8px var(--neon-cyan)) drop-shadow(0 0 20px rgba(0,245,255,.4));
}

.brand-text{
  font-family:'Orbitron',sans-serif;
  font-size:clamp(16px,3.5vw,22px);
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-bright);
  line-height:1;
}
.brand-text em{
  font-style:normal;
  background:linear-gradient(90deg,var(--neon-cyan),var(--neon-magenta));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}

.live-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,0,229,.12);
  border:1px solid rgba(255,0,229,.35);
  border-radius:4px;
  padding:4px 9px;
  font-size:10px;font-weight:700;
  letter-spacing:1.5px;
  color:var(--neon-magenta);
  font-family:'Orbitron',sans-serif;
  box-shadow:0 0 12px rgba(255,0,229,.2);
  flex-shrink:0;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--neon-magenta);
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

.header-spacer{flex:1}

.now-playing-header{
  font-size:11px;color:var(--text-mid);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:min(180px,30vw);
  display:none;
}
@media(min-width:500px){.now-playing-header{display:block}}

/* ── MAIN LAYOUT ──────────────────────────────── */
.app-layout{
  display:grid;
  grid-template-columns:1fr;
  min-height:calc(100vh - var(--header-h));
}

@media(min-width:960px){
  .app-layout{
    grid-template-columns:minmax(0,1fr) 340px;
    grid-template-rows:auto 1fr;
    max-height:calc(100vh - var(--header-h));
    overflow:hidden;
  }
}
@media(min-width:1200px){
  .app-layout{grid-template-columns:minmax(0,1fr) 380px}
}
@media(min-width:1400px){
  .app-layout{grid-template-columns:minmax(0,1fr) 420px}
}

/* ── PLAYER COLUMN ────────────────────────────── */
.player-col{
  display:flex;flex-direction:column;
}

@media(min-width:960px){
  .player-col{
    grid-column:1;
    grid-row:1/3;
    overflow-y:auto;
    overflow-x:hidden;
  }
}

/* ── PLAYER WRAP ──────────────────────────────── */
.player-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}

@media(min-width:960px){
  .player-wrap{
    aspect-ratio:unset;
    flex:1;
    min-height:300px;
  }
}

.player-wrap iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:none;
  display:block;
}

.player-placeholder{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:16px;
  background:radial-gradient(ellipse at center,#0c1a30 0%,#04060a 70%);
}

.placeholder-icon{
  width:64px;height:64px;
  border:2px solid var(--neon-cyan);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  box-shadow:var(--glow-cyan);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.placeholder-text{
  font-size:13px;color:var(--text-mid);
  text-align:center;line-height:1.6;
  font-family:'Orbitron',sans-serif;
  letter-spacing:1px;
}
.placeholder-text strong{
  display:block;
  font-size:16px;color:var(--neon-cyan);
  text-shadow:var(--glow-cyan);
  margin-bottom:8px;
}
.typewriter{
  color:var(--neon-magenta);
  font-size:12px;
  letter-spacing:1.5px;
}
.typewriter::after{
  content:'|';
  animation:blink-cursor .7s step-end infinite;
  color:var(--neon-cyan);
}
@keyframes blink-cursor{0%,100%{opacity:1}50%{opacity:0}}

/* ── NOW PLAYING BAR ──────────────────────────── */
.now-bar{
  background:rgba(0,245,255,.05);
  border-top:1px solid var(--border-glow);
  border-bottom:1px solid var(--border-dim);
  padding:10px clamp(12px,3vw,24px);
  display:flex;align-items:center;gap:10px;
}

.now-bar-label{
  font-size:9px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--neon-cyan);
  font-family:'Orbitron',sans-serif;
  flex-shrink:0;
}

.eq-bars{display:flex;gap:2px;align-items:flex-end;height:16px;flex-shrink:0}
.eq-bar{
  width:3px;border-radius:2px;
  background:linear-gradient(to top,var(--neon-cyan),var(--neon-magenta));
  animation:eq .7s ease-in-out infinite alternate;
}
.eq-bar:nth-child(1){height:5px;animation-delay:0s}
.eq-bar:nth-child(2){height:12px;animation-delay:.12s}
.eq-bar:nth-child(3){height:16px;animation-delay:.24s}
.eq-bar:nth-child(4){height:8px;animation-delay:.36s}
.eq-bar:nth-child(5){height:14px;animation-delay:.48s}
@keyframes eq{to{transform:scaleY(.2)}}

#now-title{
  flex:1;font-size:12px;font-weight:600;
  color:var(--text-bright);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ── CHANNEL SIDEBAR ──────────────────────────── */
.channel-col{
  display:flex;flex-direction:column;
  background:var(--bg-deep);
  border-left:1px solid var(--border-dim);
}

@media(min-width:960px){
  .channel-col{
    grid-column:2;
    grid-row:1/3;
    overflow:hidden;
  }
}

.channel-header{
  padding:14px clamp(12px,3vw,20px);
  border-bottom:1px solid var(--border-glow);
  background:rgba(0,245,255,.03);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;
}

.ch-header-icon{
  width:8px;height:28px;
  background:linear-gradient(to bottom,var(--neon-cyan),var(--neon-magenta));
  border-radius:4px;
  box-shadow:var(--glow-cyan);
  flex-shrink:0;
}

.ch-header-title{
  font-family:'Orbitron',sans-serif;
  font-size:11px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--text-bright);
  flex:1;
}

.ch-count{
  font-size:11px;font-weight:600;
  color:var(--neon-cyan);
  background:rgba(0,245,255,.1);
  border:1px solid rgba(0,245,255,.2);
  border-radius:20px;
  padding:2px 10px;
}

/* ── SEARCH ───────────────────────────────────── */
.search-wrap{
  padding:12px clamp(12px,3vw,20px);
  border-bottom:1px solid var(--border-dim);
  flex-shrink:0;
}

.search-inner{
  display:flex;align-items:center;gap:8px;
  background:var(--bg-card);
  border:1.5px solid var(--border-dim);
  border-radius:8px;
  padding:8px 12px;
  transition:border-color .2s,box-shadow .2s;
}
.search-inner:focus-within{
  border-color:var(--neon-cyan);
  box-shadow:0 0 0 3px rgba(0,245,255,.12);
}
.search-inner input{
  flex:1;border:none;outline:none;
  background:transparent;
  font-family:'Inter',sans-serif;
  font-size:14px;color:var(--text-bright);
}
.search-inner input::placeholder{color:var(--text-dim)}
.search-icon{font-size:14px;color:var(--text-dim);flex-shrink:0}

/* ── CHANNEL LIST ─────────────────────────────── */
.channel-list-wrap{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:10px clamp(8px,2vw,16px);
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
  gap:10px;
  align-content:start;
}

/* mobile: horizontal scroll row instead of grid */
@media(max-width:959px){
  .channel-list-wrap{
    display:flex;
    flex-direction:row;
    flex-wrap:wrap;
    gap:10px;
    max-height:none;
    padding:12px clamp(12px,4vw,20px);
  }
}

/* ── CHANNEL CARD ─────────────────────────────── */
.ch-card{
  display:flex;flex-direction:column;
  align-items:center;gap:7px;
  padding:12px 6px 10px;
  background:var(--bg-card);
  border:1.5px solid var(--border-dim);
  border-radius:12px;
  cursor:pointer;
  transition:all .18s ease;
  position:relative;
  overflow:hidden;
  min-width:80px;
}

.ch-card::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,245,255,.04),rgba(255,0,229,.04));
  opacity:0;transition:opacity .18s;
}
.ch-card:hover::before,.ch-card.active::before{opacity:1}

.ch-card:hover{
  border-color:rgba(0,245,255,.4);
  transform:translateY(-2px);
  box-shadow:0 4px 20px rgba(0,245,255,.15);
}

.ch-card.active{
  border-color:var(--neon-cyan);
  background:rgba(0,245,255,.07);
  box-shadow:0 0 0 1px var(--neon-cyan),0 4px 24px rgba(0,245,255,.2);
}

.ch-card.active::after{
  content:'▶';
  position:absolute;top:5px;right:6px;
  font-size:8px;
  color:var(--neon-cyan);
}

.ch-logo-wrap{
  width:52px;height:52px;
  border-radius:10px;
  background:var(--bg-card2);
  border:1.5px solid var(--border-dim);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  transition:border-color .18s,box-shadow .18s;
  flex-shrink:0;
}
.ch-card.active .ch-logo-wrap{
  border-color:var(--neon-cyan);
  box-shadow:0 0 12px rgba(0,245,255,.3);
}

.ch-logo-wrap img{
  width:44px;height:44px;
  object-fit:contain;
  display:block;
}

.ch-fallback{
  font-size:9px;font-weight:800;
  color:var(--text-dim);text-align:center;
  padding:2px;line-height:1.2;
}

.ch-name{
  font-size:10px;font-weight:600;
  color:var(--text-mid);
  text-align:center;
  line-height:1.3;
  word-break:break-word;
  max-width:100%;
}
.ch-card.active .ch-name{color:var(--neon-cyan)}



/* ── NEON GRID LINES BG ───────────────────────── */
.player-col::after{
  content:none;
}



/* ── EMPTY STATE ──────────────────────────────── */
.empty-state{
  grid-column:1/-1;
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px;gap:10px;color:var(--text-dim);
  text-align:center;
}
.empty-state .ei{font-size:36px;margin-bottom:4px}
.empty-state p{font-size:12px;font-weight:600}

/* ── NEON GRID DECORATION ─────────────────────── */
.neon-grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,245,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.025) 1px,transparent 1px);
  background-size:60px 60px;
}

/* ── NOW BAR IDLE ANIMATION ───────────────────── */
.now-bar-idle{
  flex:1;display:flex;align-items:center;justify-content:center;
}

.pulse-bars{
  display:flex;align-items:center;gap:3px;height:20px;
}
.pulse-bars span{
  width:3px;border-radius:3px;
  background:linear-gradient(to top,var(--neon-cyan),var(--neon-magenta));
  animation:pulse-bar 1s ease-in-out infinite alternate;
  box-shadow:0 0 4px rgba(0,245,255,.4);
}
.pulse-bars span:nth-child(1){height:4px;animation-delay:0s}
.pulse-bars span:nth-child(2){height:10px;animation-delay:.1s}
.pulse-bars span:nth-child(3){height:16px;animation-delay:.2s}
.pulse-bars span:nth-child(4){height:20px;animation-delay:.3s}
.pulse-bars span:nth-child(5){height:14px;animation-delay:.4s}
.pulse-bars span:nth-child(6){height:18px;animation-delay:.5s}
.pulse-bars span:nth-child(7){height:8px;animation-delay:.6s}
.pulse-bars span:nth-child(8){height:12px;animation-delay:.7s}
@keyframes pulse-bar{to{transform:scaleY(.15);opacity:.3}}
.shimmer{
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card2) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:10px;
}
@keyframes shimmer{to{background-position:-200% 0}}

/* ── CORNER GLOW ──────────────────────────────── */
.corner-glow{
  position:fixed;pointer-events:none;z-index:1;
  width:400px;height:400px;border-radius:50%;
  filter:blur(120px);opacity:.08;
}
.corner-glow.tl{top:-100px;left:-100px;background:var(--neon-cyan)}
.corner-glow.br{bottom:-100px;right:-100px;background:var(--neon-magenta)}

/* ── RESPONSIVE TWEAKS ────────────────────────── */
@media(max-width:959px){
  .channel-col{
    border-left:none;
    border-top:1px solid var(--border-dim);
  }
  .channel-list-wrap{
    max-height:none;
  }
}

@media(min-width:960px){
  .player-col{
    max-height:calc(100vh - var(--header-h));
    overflow-y:auto;
  }
  .channel-col{
    max-height:calc(100vh - var(--header-h));
  }
  .player-wrap{
    aspect-ratio:unset;
    flex:1;
  }
  .player-col .player-wrap{
    height:calc((100vw - 340px) * 9 / 16);
    max-height:60vh;
  }
}
</style>
</head>
<body>

<!-- DECORATIONS -->
<div class="neon-grid-bg"></div>
<div class="corner-glow tl"></div>
<div class="corner-glow br"></div>

<!-- ── HEADER ───────────────────────────────── -->
<header>
  <a class="logo-wrap" href="#">
    <!-- SVG Logo with R -->
    <div class="logo-svg-wrap">
      <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" width="44" height="44">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00f5ff"/>

          </linearGradient>
          <filter id="glow">

        <path d="M22 2L40 12V32L22 42L4 32V12L22 2Z" fill="#070c14" stroke="url(#logoGrad)" stroke-width="1.5" filter="url(#glow)"/>
        <!-- Inner accent lines -->
        <path d="M22 6L37 14.5V29.5L22 38L7 29.5V14.5L22 6Z" fill="none" stroke="url(#logoGrad)" stroke-width=".4" opacity=".4"/>
        <!-- R letter -->
        <text x="22" y="29" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="900" font-size="18" fill="url(#logoGrad)" filter="url(#glow)">R</text>
      </svg>
    </div>
    <div class="brand-text">R <em>Sport</em></div>
  </a>

<div class="header-spacer"></div>

  <div class="now-playing-header" id="header-now">Select a channel to watch</div>
</header>



<!-- ── MAIN LAYOUT ────────────────────────────── -->
<main class="app-layout">

  <!-- PLAYER COLUMN -->
  <div class="player-col">

    <!-- Player -->
    <div class="player-wrap" id="player-wrap">
      <!-- Placeholder shown before any channel is selected -->
      <div class="player-placeholder" id="player-placeholder">
        <div class="placeholder-icon">📡</div>
        <div class="placeholder-text">
          <strong>R SPORT LIVE</strong>
          <span class="typewriter" id="typewriter"></span>
        </div>
      </div>
      <!-- iframe injected by JS -->
    </div>

    <!-- Now playing bar -->
    <div class="now-bar">

      <div class="eq-bars" id="eq-bars" style="visibility:hidden">
        <div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div><div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>
      <div class="now-bar-idle" id="now-bar-idle">
        <div class="pulse-bars">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
      <div id="now-title" style="display:none"></div>
    </div>



  </div><!-- /player-col -->

  <!-- CHANNEL SIDEBAR -->
  <div class="channel-col">

    <div class="channel-header">
      <div class="ch-header-icon"></div>
      <div class="ch-header-title">Channels</div>
      <div class="ch-count" id="ch-count">14</div>
    </div>

    <div class="search-wrap">
      <div class="search-inner">
        <span class="search-icon">🔍</span>
        <input type="search" id="search" placeholder="Search channels…" autocomplete="off">
      </div>
    </div>

    <div class="channel-list-wrap" id="channel-list">
      <!-- skeleton placeholders -->
      <div class="ch-card shimmer" style="height:105px"></div>
      <div class="ch-card shimmer" style="height:105px"></div>
      <div class="ch-card shimmer" style="height:105px"></div>
      <div class="ch-card shimmer" style="height:105px"></div>
      <div class="ch-card shimmer" style="height:105px"></div>
      <div class="ch-card shimmer" style="height:105px"></div>
    </div>

  </div><!-- /channel-col -->

</main>

<script>
// ── CHANNELS DATA ─────────────────────────────

// ── STATE ─────────────────────────────────────
let activeIndex = -1;
let filtered = [...CHANNELS];

// ── RENDER CHANNELS ───────────────────────────
function renderChannels(list){
  const wrap = document.getElementById('channel-list');
  document.getElementById('ch-count').textContent = list.length;

  if(!list.length){
    wrap.innerHTML = '<div class="empty-state"><div class="ei">📺</div><p>No channels found</p></div>';
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach((ch, i) => {
    const originalIndex = CHANNELS.indexOf(ch);
    const card = document.createElement('div');
    card.className = 'ch-card' + (originalIndex === activeIndex ? ' active' : '');
    card.dataset.idx = originalIndex;

    const logoHtml = ch.logo
      ? `<img src="${esc(ch.logo)}" alt="${esc(ch.name)}" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const fallbackStyle = ch.logo ? 'display:none' : '';

    card.innerHTML = `
      <div class="ch-logo-wrap">
        ${logoHtml}
        <div class="ch-fallback" style="${fallbackStyle}">${esc(ch.name.substring(0,6))}</div>
      </div>
      <div class="ch-name">${esc(ch.name)}</div>`;

    card.addEventListener('click', () => playChannel(originalIndex));
    frag.appendChild(card);
  });

  wrap.innerHTML = '';
  wrap.appendChild(frag);
}

// ── PLAY CHANNEL ──────────────────────────────
function playChannel(idx){
  activeIndex = idx;
  const ch = CHANNELS[idx];

  // update UI
  renderChannels(filtered);

  // inject iframe
  const wrap = document.getElementById('player-wrap');
  const placeholder = document.getElementById('player-placeholder');
  if(placeholder) placeholder.remove();

  // remove old iframe
  const old = wrap.querySelector('iframe');
  if(old) old.remove();

  const iframe = document.createElement('iframe');
  iframe.src = ch.url;
  iframe.allowFullscreen = true;
  iframe.allow = "autoplay; fullscreen; picture-in-picture";
  iframe.setAttribute('scrolling','no');
  iframe.setAttribute('frameborder','0');
  wrap.appendChild(iframe);

  // update now-playing
  const title = '▶ ' + ch.name;
  document.getElementById('now-title').textContent = title;
  document.getElementById('now-title').style.display = 'block';
  document.getElementById('now-bar-idle').style.display = 'none';
  document.getElementById('header-now').textContent = title;
  document.getElementById('eq-bars').style.visibility = 'visible';

  // scroll to top on mobile
  if(window.innerWidth < 960){
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

// ── TYPEWRITER ANIMATION ──────────────────────
(function(){
  const messages = [
    'SELECT A CHANNEL',
    'LIVE SPORTS AWAIT',
    'CHOOSE & ENJOY'
  ];
  let mi = 0, ci = 0, deleting = false;
  const el = document.getElementById('typewriter');
  if(!el) return;
  function type(){
    const msg = messages[mi];
    if(!deleting){
      el.textContent = msg.substring(0, ++ci);
      if(ci === msg.length){ deleting = true; setTimeout(type, 1800); return; }
    } else {
      el.textContent = msg.substring(0, --ci);
      if(ci === 0){ deleting = false; mi = (mi+1) % messages.length; setTimeout(type, 400); return; }
    }
    setTimeout(type, deleting ? 45 : 90);
  }
  type();
})();

// ── SEARCH ────────────────────────────────────
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = e.target.value.toLowerCase().trim();
    filtered = q ? CHANNELS.filter(ch => ch.name.toLowerCase().includes(q)) : [...CHANNELS];
    renderChannels(filtered);
  }, 180);
});

// ── UTILS ─────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
