<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0a0e14">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>R Sport - Live TV</title>
<!-- Preconnect to speed up font & CDN loading -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://iptv-org.github.io">
<!-- font-display:swap prevents FOIT -->
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- HLS.js loaded async; we gate playback on its readiness -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js" async fetchpriority="high"></script>
<style>
/* ── RESET & TOKENS ─────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --accent:#ff2d55;--accent2:#ff6030;--accent-glow:rgba(255,45,85,.3);
  --bg:#0a0e14;--bg2:#111720;--bg3:#171f2b;
  --surface:#1a2232;--surface2:#212d40;--border:#1e2d42;
  --text:#e8f0fe;--text2:#8899bb;--text3:#4a5a78;
  --header-h:58px;
}

body.light-mode{
  --accent:#e0002e;--accent2:#cc4000;--accent-glow:rgba(224,0,46,.2);
  --bg:#eef2f8;--bg2:#e4eaf4;--bg3:#d8e2f0;
  --surface:#fff;--surface2:#f0f4fc;--border:#c8d4e8;
  --text:#1a2540;--text2:#4a5f88;--text3:#8899bb;
}

html{scroll-behavior:smooth}

body{
  font-family:'Exo 2',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  /* safe-area for notched phones */
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── HEADER ─────────────────────────────────────── */
header{
  background:#080c12;
  padding:10px 16px;
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:200;
  border-bottom:1px solid rgba(255,45,85,.15);
  box-shadow:0 2px 20px rgba(0,0,0,.5);
  height:var(--header-h);
}

.app-icon{
  width:38px;height:38px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;
  box-shadow:0 0 12px var(--accent-glow);
}

.app-name{
  flex:1;font-family:'Rajdhani',sans-serif;
  font-size:20px;font-weight:700;color:#fff;
  letter-spacing:1.5px;text-transform:uppercase;
}
.app-name span{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.header-right{display:flex;align-items:center;gap:8px;}

.mode-toggle{
  width:36px;height:36px;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;transition:all .2s;flex-shrink:0;
}
.mode-toggle:active{transform:scale(.9)}

.live-pill{
  background:linear-gradient(90deg,#ff2d55,#ff6030);color:#fff;
  font-size:10px;font-weight:800;padding:5px 9px;border-radius:5px;
  display:flex;align-items:center;gap:5px;letter-spacing:1.5px;
  font-family:'Rajdhani',sans-serif;box-shadow:0 0 10px rgba(255,45,85,.35);
}
.live-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* ── PLAYER ─────────────────────────────────────── */
.player-section{background:#000;position:relative;}

video{
  width:100%;aspect-ratio:16/9;display:block;background:#000;
  /* crisp rendering on high-DPI screens */
  image-rendering:auto;
}

.player-overlay{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);flex-direction:column;gap:12px;
  font-size:13px;color:var(--text2);text-align:center;padding:20px;
}
.spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CONTROLS ───────────────────────────────────── */
.controls{
  background:var(--bg2);padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);gap:12px;
}

.now-info{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;flex:1;min-width:0;text-align:center;padding-left:18%;
}
.eq-bars{display:flex;gap:2px;align-items:flex-end;height:14px;justify-content:center;}
.eq-bar{width:3px;background:linear-gradient(to top,var(--accent),var(--accent2));border-radius:2px;animation:eq .8s ease-in-out infinite alternate;}
.eq-bar:nth-child(1){height:5px;animation-delay:0s}
.eq-bar:nth-child(2){height:10px;animation-delay:.15s}
.eq-bar:nth-child(3){height:14px;animation-delay:.3s}
.eq-bar:nth-child(4){height:7px;animation-delay:.45s}
.eq-bar:nth-child(5){height:11px;animation-delay:.6s}
@keyframes eq{to{transform:scaleY(.25)}}

#now-title-ctrl{
  font-size:12px;font-weight:700;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;
  text-align:center;
}

/* ── QUALITY SELECTOR ───────────────────────────── */
.quality-wrap{position:relative;flex-shrink:0;}

.quality-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;padding:7px 11px;cursor:pointer;
  transition:all .15s;
}
.quality-btn:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}

.q-icon{
  font-size:9px;font-weight:900;font-family:'Rajdhani',sans-serif;
  letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  padding:2px 5px;border-radius:4px;
}
#q-label{
  font-size:12px;font-weight:700;color:var(--text);
  font-family:'Exo 2',sans-serif;min-width:32px;
}
.q-arrow{font-size:11px;color:var(--text3);transition:transform .2s;}
.quality-btn.open .q-arrow{transform:rotate(180deg);}

.quality-menu{
  display:none;position:absolute;bottom:calc(100% + 6px);right:0;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:10px;min-width:140px;z-index:400;
  box-shadow:0 -4px 24px rgba(0,0,0,.5);overflow:hidden;
}
.quality-menu.open{display:block;}

.quality-opt{
  padding:9px 14px;font-family:'Exo 2',sans-serif;font-size:12px;
  font-weight:700;color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border);transition:background .12s;
}
.quality-opt:last-child{border-bottom:none;}
.quality-opt:hover{background:var(--surface2);}
.quality-opt.active-q{color:var(--accent);}
.quality-opt.active-q::after{content:'✓';font-size:11px;color:var(--accent);}
.q-badge{
  font-size:10px;background:rgba(255,45,85,.12);color:var(--accent);
  padding:1px 5px;border-radius:4px;font-weight:800;letter-spacing:.3px;
}

/* ── SEARCH ─────────────────────────────────────── */
.search-wrap{padding:12px 16px 8px;background:var(--bg);}
.search-box{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:9px;padding:10px 14px;transition:border-color .2s,box-shadow .2s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.search-box input{
  flex:1;border:none;outline:none;background:transparent;
  font-family:'Exo 2',sans-serif;font-size:14px;color:var(--text);
}
.search-box input::placeholder{color:var(--text3);}

/* ── COUNTRY SECTION ────────────────────────────── */
.country-section{background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--border);}
.section-title-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.accent-bar{width:4px;height:18px;background:linear-gradient(to bottom,var(--accent),var(--accent2));border-radius:3px;flex-shrink:0;}
.section-title-row span{
  font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text2);font-family:'Rajdhani',sans-serif;
}
.country-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.country-row::-webkit-scrollbar{display:none}

.cnt-btn{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;cursor:pointer;}
.cnt-flag-circle{
  width:52px;height:52px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:26px;
  transition:all .18s;position:relative;
}
.cnt-btn.active .cnt-flag-circle{
  border-color:var(--accent);background:rgba(255,45,85,.1);
  box-shadow:0 0 0 3px var(--accent-glow);
}
.cnt-btn.active .cnt-flag-circle::after{
  content:'✓';position:absolute;bottom:-3px;right:-3px;
  width:16px;height:16px;background:var(--accent);border-radius:50%;
  border:2px solid var(--bg);font-size:9px;color:#000;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;line-height:12px;text-align:center;
}
.cnt-name{font-size:10px;font-weight:700;color:var(--text3);max-width:54px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cnt-btn.active .cnt-name{color:var(--accent);}

/* ── CATEGORY TABS ──────────────────────────────── */
.tabs-wrap{
  background:var(--bg2);padding:10px 16px;display:flex;
  gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);
}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab{
  background:var(--surface);border:1.5px solid var(--border);color:var(--text2);
  padding:7px 14px;border-radius:20px;font-family:'Exo 2',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  flex-shrink:0;transition:all .15s;display:flex;align-items:center;gap:5px;
}
.tab .cnt{font-size:10px;color:var(--text3);transition:color .15s;}
.tab.active{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  border-color:transparent;color:#000;font-weight:800;
  box-shadow:0 2px 10px var(--accent-glow);
}
.tab.active .cnt{color:rgba(0,0,0,.6);}

/* ── GRID HEADER ────────────────────────────────── */
.grid-hdr{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;background:var(--bg);}
.grid-hdr-title{
  font-size:13px;font-weight:800;color:var(--text);letter-spacing:1px;
  flex:1;font-family:'Rajdhani',sans-serif;text-transform:uppercase;
}
.grid-hdr-count{font-size:12px;color:var(--text3);font-weight:600;}

/* ── CHANNEL GRID ───────────────────────────────── */
.ch-grid{
  content-visibility:auto;
  contain-intrinsic-size:0 800px;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:8px;padding:0 16px 30px;
  background:var(--bg);
}

.ch-card{
  background:var(--surface);border-radius:10px;
  padding:14px 8px 10px;display:flex;flex-direction:column;
  align-items:center;gap:7px;cursor:pointer;
  border:1.5px solid var(--border);transition:all .15s;
  position:relative;animation:fadeUp .25s ease both;
  /* contain paint to avoid layout thrash */
  contain:layout style;
  will-change:transform;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ch-card:active{transform:scale(.95);}
.ch-card.playing{
  border-color:var(--accent);background:rgba(255,45,85,.08);
  box-shadow:0 0 0 1px var(--accent),0 4px 16px var(--accent-glow);
}

.on-air-tag{
  position:absolute;top:0;left:8px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  color:#000;font-size:7px;font-weight:900;padding:2px 7px;
  border-radius:0 0 6px 6px;letter-spacing:1px;
  font-family:'Rajdhani',sans-serif;display:none;
}
.ch-card.playing .on-air-tag{display:block;}

.logo-circle{
  width:60px;height:60px;border-radius:14px;
  background:var(--surface2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;transition:border-color .15s;
}
.ch-card.playing .logo-circle{border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow);}
.ch-logo{width:50px;height:50px;object-fit:contain;loading:lazy;}
.ch-fallback{font-size:10px;font-weight:800;color:var(--text3);text-align:center;padding:2px;}
.ch-label{font-size:11px;font-weight:700;color:var(--text2);text-align:center;line-height:1.3;word-break:break-word;}
.ch-card.playing .ch-label{color:var(--accent);}

/* ── SKELETON ───────────────────────────────────── */
.skel-card{background:var(--surface);border-radius:10px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;}
.skel{
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:6px;
}
@keyframes shimmer{to{background-position:-200% 0}}
.empty-state{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text3);}
.empty-state .ei{font-size:40px;margin-bottom:10px;}
.empty-state p{font-size:14px;font-weight:700;}


/* ── RESPONSIVE ─────────────────────────────────── */

/* Small phones (< 360px) */
@media (max-width:359px){
  .ch-grid{grid-template-columns:repeat(2,1fr);gap:6px;padding:0 10px 30px;}
  .logo-circle{width:50px;height:50px;}
  .ch-logo{width:40px;height:40px;}
  .ch-label{font-size:10px;}
  #now-title-ctrl{max-width:110px;}
}

/* Tablet: 600px+ */
@media (min-width:600px){
  :root{--header-h:66px;}
  header{padding:14px 24px;}
  .app-name{font-size:24px;}
  .app-icon{width:44px;height:44px;font-size:22px;}

  .controls{padding:12px 24px;}
  #now-title-ctrl{max-width:280px;}

  .search-wrap{padding:14px 24px 10px;}
  .country-section{padding:14px 24px 12px;}
  .tabs-wrap{padding:12px 24px;gap:10px;}
  .grid-hdr{padding:16px 24px 12px;}

  .ch-grid{grid-template-columns:repeat(4,1fr);gap:10px;padding:0 24px 30px;}
  .logo-circle{width:68px;height:68px;}
  .ch-logo{width:56px;height:56px;}
  .ch-label{font-size:12px;}
}

/* Desktop: 960px+ — sidebar layout */
@media (min-width:960px){
  :root{--header-h:62px;}

  body{
    display:grid;
    grid-template-columns:320px 1fr;
    grid-template-rows:var(--header-h) auto auto auto auto 1fr;
  }

  header{grid-column:1/-1;padding:14px 32px;}

  .player-section{
    grid-column:1;grid-row:2/7;
    display:flex;flex-direction:column;
    position:sticky;top:var(--header-h);
    height:calc(100vh - var(--header-h));
    overflow:hidden;border-right:1px solid var(--border);
  }
  video{aspect-ratio:unset;flex:1;width:100%;height:100%;object-fit:contain;}

  .controls{
    grid-column:1;grid-row:auto;
    padding:14px 20px;
    border-top:1px solid var(--border);
    border-bottom:none;
  }

  .search-wrap   {grid-column:2;padding:16px 28px 10px;}
  .country-section{grid-column:2;padding:14px 28px 12px;}
  .tabs-wrap     {grid-column:2;padding:12px 28px;}
  .grid-hdr      {grid-column:2;padding:16px 28px 12px;}

  .ch-grid{
    grid-column:2;
    grid-template-columns:repeat(5,1fr);
    gap:12px;padding:0 28px 30px; 
  }

  .logo-circle{width:72px;height:72px;border-radius:16px;}
  .ch-logo{width:60px;height:60px;}
  .ch-label{font-size:12px;}
  #now-title-ctrl{max-width:220px;}

  /* URL bar spans full width on desktop */
}

/* Large desktop / TV: 1400px+ */
@media (min-width:1400px){
  body{grid-template-columns:400px 1fr;}
  header{padding:16px 40px;}
  .app-name{font-size:28px;}
  .app-icon{width:50px;height:50px;font-size:26px;}

  .search-wrap   {padding:20px 36px 12px;}
  .country-section{padding:16px 36px 14px;}
  .tabs-wrap     {padding:14px 36px;gap:12px;}
  .grid-hdr      {padding:18px 36px 14px;}

  .ch-grid{grid-template-columns:repeat(6,1fr);gap:14px;padding:0 36px 40px;}
  .logo-circle{width:80px;height:80px;border-radius:18px;}
  .ch-logo{width:66px;height:66px;}
  .ch-label{font-size:13px;}
  .tab{font-size:13px;padding:8px 18px;}
  #now-title-ctrl{max-width:300px;}
}

/* Landscape phones — compact player */
@media (max-height:500px) and (orientation:landscape){
  header{height:44px;padding:6px 16px;}
  :root{--header-h:44px;}
  video{aspect-ratio:16/9;max-height:calc(100vh - 44px);}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="app-icon">📡</div>
  <div class="app-name">R <span>Sport</span></div>
  <div class="header-right">
    <div class="mode-toggle" id="mode-toggle" title="Toggle light/dark mode">🌙</div>
  </div>
</header>

<!-- PLAYER -->
<div class="player-section">
  <video id="video" controls autoplay playsinline></video>
  <div class="player-overlay" id="player-overlay">
    <div class="spinner" id="spinner"></div>
    <div id="overlay-msg"></div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="now-info">
    <div class="eq-bars">
      <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
      <div class="eq-bar"></div><div class="eq-bar"></div>
    </div>
    <div id="now-title-ctrl"></div>
  </div>
  <div class="quality-wrap">
    <button class="quality-btn" id="btn-quality">
      <span class="q-icon">HD</span>
      <span id="q-label">Auto</span>
      <span class="q-arrow">▾</span>
    </button>
    <div class="quality-menu" id="quality-menu"></div>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search" placeholder="Search channels..." autocomplete="off" autocorrect="off" spellcheck="false">
  </div>
</div>

<!-- COUNTRY PICKER -->
<div class="country-section">
  <div class="section-title-row">
    <div class="accent-bar"></div>
    <span>🌍 Browse by Country</span>
  </div>
  <div class="country-row" id="country-row">
    <div style="display:flex;gap:10px;align-items:center;padding:4px 0">
      <div style="width:52px;height:52px;border-radius:50%" class="skel"></div>
      <div style="width:52px;height:52px;border-radius:50%" class="skel"></div>
      <div style="width:52px;height:52px;border-radius:50%" class="skel"></div>
      <div style="width:52px;height:52px;border-radius:50%" class="skel"></div>
    </div>
  </div>
</div>

<!-- CATEGORY TABS -->
<div class="tabs-wrap" id="tabs-wrap"></div>

<!-- GRID HEADER -->
<div class="grid-hdr">
  <div class="accent-bar"></div>
  <div class="grid-hdr-title" id="grid-title">BANGLADESH CHANNELS</div>
  <div class="grid-hdr-count" id="grid-count"></div>
</div>

<!-- GRID -->
<div class="ch-grid" id="ch-grid">
  <div class="skel-card"><div class="skel" style="width:60px;height:60px;border-radius:16px"></div><div class="skel" style="width:70%;height:10px"></div></div>
  <div class="skel-card"><div class="skel" style="width:60px;height:60px;border-radius:16px"></div><div class="skel" style="width:55%;height:10px"></div></div>
  <div class="skel-card"><div class="skel" style="width:60px;height:60px;border-radius:16px"></div><div class="skel" style="width:65%;height:10px"></div></div>
  <div class="skel-card"><div class="skel" style="width:60px;height:60px;border-radius:16px"></div><div class="skel" style="width:60%;height:10px"></div></div>
  <div class="skel-card"><div class="skel" style="width:60px;height:60px;border-radius:16px"></div><div class="skel" style="width:75%;height:10px"></div></div>
  <div class="skel-card"><div class="skel" style="width:60px;height:60px;border-radius:16px"></div><div class="skel" style="width:50%;height:10px"></div></div>
</div>



<script>
'use strict';

let allStreams=[], allChannels={}, allCountries={}, allLogos={};
let activeHls=null, filteredList=[], currentIndex=-1;
let activeCountry='BD', activeCategory='', currentCard=null;
let hlsReady=false;

/* Wait for HLS.js async script */
function onHlsLoaded(fn){
  if(typeof Hls!=='undefined'){hlsReady=true;fn&&fn();}
  else document.querySelector('[src*="hls.min.js"]').addEventListener('load',()=>{hlsReady=true;fn&&fn();});
}

const CAT_ICONS={
  news:'📰',sports:'⚽',movies:'🎬',entertainment:'🎭',
  music:'🎵',kids:'🧸',documentary:'🎞️',cooking:'🍳',
  travel:'✈️',business:'💼',weather:'🌤️',religious:'🕌',
  general:'📡',auto:'🚗',legislative:'🏛️',shop:'🛍️',
  series:'📺',animation:'🎨',education:'📚'
};

/* ── NIGHT MODE ──────────────────────────────────── */
const modeBtn=document.getElementById('mode-toggle');
let isLight=false;
modeBtn.addEventListener('click',()=>{
  isLight=!isLight;
  document.body.classList.toggle('light-mode',isLight);
  modeBtn.textContent=isLight?'🌙':'☀️';
});

/* ── DATA LOADING (parallel, cached) ────────────── */
const API='https://iptv-org.github.io/api/';
async function fetchJSON(path){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),12000); // 12s timeout
  try{
    const r=await fetch(API+path,{cache:'force-cache',signal:ctrl.signal});
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }finally{clearTimeout(tid);}
}

async function loadData(){
  try{
    /* Fetch all 4 endpoints in parallel */
    const [s,c,co,lg]=await Promise.all([
      fetchJSON('streams.json'),
      fetchJSON('channels.json'),
      fetchJSON('countries.json'),
      fetchJSON('logos.json'),
    ]);
    /* Index for O(1) lookups */
    c.forEach(x=>allChannels[x.id]=x);
    co.forEach(x=>allCountries[x.code]=x);
    lg.forEach(x=>{ if(x.in_use&&!allLogos[x.channel]) allLogos[x.channel]=x.url; });
    /* Only keep m3u8 streams */
    allStreams=s.filter(x=>x.url&&x.url.includes('.m3u8'));
    buildCountryRow(c);
    buildTabs(c);
    renderGrid();
  }catch(e){
    document.getElementById('ch-grid').innerHTML='<div class="empty-state"><div class="ei">😢</div><p>Failed to load. Check connection.</p></div>';
  }
}

/* ── COUNTRY ROW ─────────────────────────────────── */
function buildCountryRow(channels){
  const cntCount={};
  channels.forEach(c=>{if(c.country) cntCount[c.country]=(cntCount[c.country]||0)+1;});
  const sorted=Object.entries(cntCount)
    .sort((a,b)=>{if(a[0]==='BD')return -1;if(b[0]==='BD')return 1;return b[1]-a[1];})
    .slice(0,50);

  const row=document.getElementById('country-row');
  row.innerHTML='';
  row.appendChild(mkCountryBtn('🌍','All',''));
  sorted.forEach(([code])=>{
    const cnt=allCountries[code]; if(!cnt) return;
    const btn=mkCountryBtn(cnt.flag||'🏳️',cnt.name.length>8?cnt.name.slice(0,8)+'…':cnt.name,code);
    row.appendChild(btn);
    if(code==='BD') setTimeout(()=>btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}),400);
  });
}

function mkCountryBtn(flag,name,code){
  const btn=document.createElement('div');
  btn.className='cnt-btn'+(activeCountry===code?' active':'');
  btn.dataset.code=code;
  btn.innerHTML=`<div class="cnt-flag-circle">${flag}</div><div class="cnt-name">${name}</div>`;
  btn.addEventListener('click',()=>{
    activeCountry=code;activeCategory='';
    document.querySelectorAll('.cnt-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const first=document.querySelector('.tab');
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    if(first) first.classList.add('active');
    renderGrid();
  });
  return btn;
}

/* ── CATEGORY TABS ───────────────────────────────── */
function buildTabs(channels){
  const catCount={};
  channels.forEach(c=>(c.categories||[]).forEach(cat=>{catCount[cat]=(catCount[cat]||0)+1;}));
  const wrap=document.getElementById('tabs-wrap');
  wrap.appendChild(mkTab('All','',allStreams.length,true));
  Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,14).forEach(([cat,count])=>{
    wrap.appendChild(mkTab(capitalize(cat),cat,count,false));
  });
}

function mkTab(label,cat,count,active){
  const t=document.createElement('div');
  t.className='tab'+(active?' active':'');
  t.innerHTML=`${CAT_ICONS[cat]||'📺'} ${label} <span class="cnt">${count}</span>`;
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeCategory=cat;
    renderGrid();
  });
  return t;
}

/* ── GRID ────────────────────────────────────────── */
function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  return allStreams.filter(s=>{
    const ch=allChannels[s.channel]||{};
    const title=(s.title||ch.name||'').toLowerCase();
    if(q&&!title.includes(q)) return false;
    if(activeCountry&&ch.country!==activeCountry) return false;
    if(activeCategory&&!(ch.categories||[]).includes(activeCategory)) return false;
    return true;
  });
}

function renderGrid(){
  filteredList=getFiltered().slice(0,300);
  // Defer paint to next animation frame to avoid layout thrash
  const grid=document.getElementById('ch-grid');
  const cnt=allCountries[activeCountry];
  const cntName=cnt?cnt.name:'All Countries';
  const flag=cnt?cnt.flag+' ':'';
  const catLabel=activeCategory?' · '+capitalize(activeCategory).toUpperCase():'';
  document.getElementById('grid-title').textContent=flag+(activeCountry?cntName.toUpperCase():activeCategory?capitalize(activeCategory).toUpperCase()+' CHANNELS':'ALL CHANNELS')+catLabel;
  document.getElementById('grid-count').textContent=filteredList.length+' ch';

  if(!filteredList.length){
    grid.innerHTML='<div class="empty-state"><div class="ei">📺</div><p>No channels found</p></div>';
    return;
  }

  /* Build HTML string in one pass — avoids repeated reflows */
  const frag=filteredList.map((s,i)=>{
    const ch=allChannels[s.channel]||{};
    const name=esc(s.title||ch.name||'TV');
    const logo=(ch.id&&allLogos[ch.id])?allLogos[ch.id]:(ch.logo||'');
    const logoHtml=logo
      ?`<img class="ch-logo" src="${logo}" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt="${name}"><div class="ch-fallback" style="display:none">${name.substring(0,5)}</div>`
      :`<div class="ch-fallback">${name.substring(0,5)}</div>`;
    return `<div class="ch-card" data-i="${i}">
      <div class="on-air-tag">ON AIR</div>
      <div class="logo-circle">${logoHtml}</div>
      <div class="ch-label">${name}</div>
    </div>`;
  }).join('');

  requestAnimationFrame(()=>{
    grid.innerHTML=frag;
    grid.querySelectorAll('.ch-card').forEach((card,i)=>{
      card.addEventListener('click',()=>selectChannel(i,card),{passive:true});
    });
  });
}

/* ── CHANNEL SELECTION ───────────────────────────── */
function selectChannel(i,cardEl){
  if(currentCard) currentCard.classList.remove('playing');
  currentCard=cardEl;
  cardEl.classList.add('playing');
  cardEl.scrollIntoView({behavior:'smooth',block:'nearest'});
  const s=filteredList[i];
  const ch=allChannels[s.channel]||{};
  document.getElementById('now-title-ctrl').textContent='▶ '+(s.title||ch.name||'Unknown');
  showLoading();
  onHlsLoaded(()=>startHls(s.url));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── HLS PLAYBACK (high quality config) ─────────── */
function startHls(url){
  const video=document.getElementById('video');
  if(activeHls){activeHls.destroy();activeHls=null;}
  video.src='';

  if(typeof Hls!=='undefined'&&Hls.isSupported()){
    const hls=new Hls({
      /* Quality — always prefer highest available level */
      startLevel:-1,           // auto-start, picks best based on bandwidth
      autoLevelCapping:-1,     // no cap: allows 1080p/4K if available
      capLevelToPlayerSize:false, // don't limit by CSS size
      maxLoadingDelay:4,       // seconds before giving up on a segment
      /* Buffer — more buffer = smoother, higher quality ABR decisions */
      maxBufferLength:30,      // keep 60 s of video buffered
      maxMaxBufferLength:60,  // allow up to 2 min buffer
      maxBufferSize:60*1000*1000, // 60 MB buffer
      /* Startup speed — fetch first segment ASAP */
      manifestLoadingMaxRetry:3,
      levelLoadingMaxRetry:4,
      fragLoadingMaxRetry:4,
      enableWorker:true,       // offload demuxing to worker thread
      lowLatencyMode:false,    // off for broadcast; saves bandwidth
      /* ABR — give it more data before switching down */
      abrEwmaDefaultEstimate:500000, // assume 500 kbps as starting estimate
      abrBandWidthFactor:0.95,
      abrBandWidthUpFactor:0.7,
    });
    activeHls=hls;
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,(_,data)=>{
      /* Jump straight to highest quality level */
      hls.currentLevel=data.levels.length-1;
      hideOverlay();
      video.play().catch(()=>{});
      /* Rebuild quality menu */
      qLabel.textContent='Auto';
      buildQualityMenu();
    });
    hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal) showError();});
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
    /* Safari native HLS — already does high quality */
    video.src=url;
    video.onloadedmetadata=()=>{hideOverlay();video.play().catch(()=>{});};
    video.onerror=showError;
  } else {
    showError();
  }
}

/* ── OVERLAY HELPERS ─────────────────────────────── */
function showLoading(){
  const o=document.getElementById('player-overlay');
  o.style.display='flex';
  document.getElementById('spinner').style.display='block';
  document.getElementById('overlay-msg').textContent='';
}
function hideOverlay(){document.getElementById('player-overlay').style.display='none';}
function showError(){
  const o=document.getElementById('player-overlay');
  o.style.display='flex';
  document.getElementById('spinner').style.display='none';
  document.getElementById('overlay-msg').textContent='⚠️ Stream unavailable — try another channel';
}

/* ── SEARCH (debounced) ──────────────────────────── */
let ft;
document.getElementById('search').addEventListener('input',()=>{clearTimeout(ft);ft=setTimeout(renderGrid,150);});

/* ── QUALITY SELECTOR ────────────────────────────── */
const qualityBtn=document.getElementById('btn-quality');
const qualityMenu=document.getElementById('quality-menu');
const qLabel=document.getElementById('q-label');

qualityBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  qualityMenu.classList.toggle('open');
  qualityBtn.classList.toggle('open');
});

document.addEventListener('click',()=>{
  qualityMenu.classList.remove('open');
  qualityBtn.classList.remove('open');
});

function buildQualityMenu(){
  qualityMenu.innerHTML='';
  if(!activeHls||!activeHls.levels||activeHls.levels.length===0){
    qualityMenu.innerHTML='<div class="quality-opt">No levels available</div>';
    return;
  }
  // Auto option
  const autoOpt=document.createElement('div');
  autoOpt.className='quality-opt active-q';
  autoOpt.innerHTML='Auto <span class="q-badge">ABR</span>';
  autoOpt.addEventListener('click',()=>{
    activeHls.currentLevel=-1;
    qLabel.textContent='Auto';
    refreshQualityMenu();
    qualityMenu.classList.remove('open');
    qualityBtn.classList.remove('open');
  });
  qualityMenu.appendChild(autoOpt);

  // Per-level options (highest first)
  [...activeHls.levels].reverse().forEach((lv,ri)=>{
    const origIdx=activeHls.levels.length-1-ri;
    const h=lv.height||'';
    const bw=lv.bitrate?Math.round(lv.bitrate/1000)+'k':'';
    const label=h?h+'p':(bw||'Level '+(origIdx+1));
    const opt=document.createElement('div');
    opt.className='quality-opt';
    opt.innerHTML=`${label}${bw?' <span class="q-badge">'+bw+'</span>':''}`;
    opt.addEventListener('click',()=>{
      activeHls.currentLevel=origIdx;
      qLabel.textContent=label;
      refreshQualityMenu();
      qualityMenu.classList.remove('open');
      qualityBtn.classList.remove('open');
    });
    qualityMenu.appendChild(opt);
  });
}

function refreshQualityMenu(){
  document.querySelectorAll('.quality-opt').forEach((o,i)=>{
    o.classList.remove('active-q');
    if(i===0&&activeHls.currentLevel===-1) o.classList.add('active-q');
    else if(i>0){
      const origIdx=activeHls.levels.length-i;
      if(activeHls.currentLevel===origIdx) o.classList.add('active-q');
    }
  });
}

/* ── UTILS ───────────────────────────────────────── */
function capitalize(s){return s?s[0].toUpperCase()+s.slice(1):'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── BOOT ────────────────────────────────────────── */
loadData();
</script>
